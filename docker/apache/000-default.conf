<VirtualHost *:80>
    ServerName elvethgroup.co.tz
    ServerAlias www.elvethgroup.co.tz
    DocumentRoot /var/www/html

    # The container runs behind the host reverse proxy - make WordPress
    # believe the request was made over HTTPS.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    SetEnvIf X-Forwarded-Port "443" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/elveth-error.log
    CustomLog ${APACHE_LOG_DIR}/elveth-access.log combined
</VirtualHost>
