# ---------------------------------------------------------------------------
# Elveth Group - WordPress virtual host (host nginx -> Docker WordPress)
# Installed to /etc/nginx/sites-available/elvethgroup.co.tz.conf
# TLS is added afterwards by certbot (which rewrites this file).
# ---------------------------------------------------------------------------

# Shared upstream / snippet
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name elvethgroup.co.tz www.elvethgroup.co.tz;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Dockerised WordPress
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 128M;
    }

    # Static assets caching (uploads are served by the container)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/elvethgroup.access.log;
    error_log  /var/log/nginx/elvethgroup.error.log;
}
