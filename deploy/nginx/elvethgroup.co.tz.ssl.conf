# ---------------------------------------------------------------------------
# Elveth Group - WordPress virtual host with TLS (host nginx -> Docker WordPress)
# Used by scripts/install-nginx.sh once the Let's Encrypt certificate exists.
# __APP_PORT__ is replaced with APP_PORT from .env at install time.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name elvethgroup.co.tz www.elvethgroup.co.tz;

    # Let's Encrypt HTTP-01 challenge (renewals)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://elvethgroup.co.tz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elvethgroup.co.tz www.elvethgroup.co.tz;

    ssl_certificate     /etc/letsencrypt/live/elvethgroup.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elvethgroup.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.elvethgroup.co.tz) {
        return 301 https://elvethgroup.co.tz$request_uri;
    }

    # The site is restored from a database dump; the installer must never be
    # reachable from the internet (it would let anyone create an admin).
    location = /wp-admin/install.php { return 403; }

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 128M;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/elvethgroup.access.log;
    error_log  /var/log/nginx/elvethgroup.error.log;
}
