name: Deploy to Elveth ERP VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_uploads:
        description: "Skip uploading wp-content/uploads"
        type: boolean
        default: false

concurrency:
  group: elvethgroup-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/elvethgroup
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint changed PHP files
        run: |
          set -e
          files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -E '\.php$' || true)
          if [ -z "$files" ]; then
            echo "No PHP files changed - nothing to lint"
            exit 0
          fi
          echo "$files" | xargs -n1 -I{} php -l {} | grep -v "No syntax errors" || true
          echo "$files" | xargs -n1 -I{} php -l {} >/dev/null

  build:
    name: Build and push image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - id: check
        env:
          HAS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HAS_SERVER_ENV: ${{ secrets.SERVER_ENV }}
          HAS_VPS_HOST: ${{ secrets.VPS_HOST }}
          HAS_VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -n "$HAS_SSH_KEY" ] && [ -n "$HAS_SERVER_ENV" ] && [ -n "$HAS_VPS_HOST" ] && [ -n "$HAS_VPS_USER" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing deploy secrets/vars - deploy will be skipped."
          fi

  deploy:
    name: Deploy to VPS
    needs: [build, gate]
    if: needs.gate.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "Invalid SSH key"; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Upload stack configuration
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ env.APP_DIR }}"
          rsync -az -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" --delete --exclude 'backups' --exclude '.env' \
            docker-compose.yml docker/ scripts/ deploy/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/

      - name: Sync media (wp-content/uploads)
        if: ${{ inputs.skip_uploads != true }}
        run: |
          [ -d wp-content/uploads ] || exit 0
          rsync -az -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" --no-delete --exclude '*.tmp' \
            wp-content/uploads/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/uploads/

      - name: Log the VPS in to GHCR (package is private)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy stack
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash -s" <<'EOF'
          set -e
          mkdir -p /opt/elvethgroup/backups
          cat > /opt/elvethgroup/.env <<'ENVFILE'
          ${{ secrets.SERVER_ENV }}
          ENVFILE
          chmod 600 /opt/elvethgroup/.env
          cd /opt/elvethgroup
          chmod +x scripts/*.sh
          bash scripts/deploy.sh
          EOF

      - name: Install / refresh nginx virtual host
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash -s" <<'EOF'
          set -e
          cd /opt/elvethgroup
          if command -v nginx >/dev/null 2>&1; then
            bash scripts/install-nginx.sh
          else
            echo "nginx not installed - skipping virtual host setup"
          fi
          EOF

      - name: Verify site
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash -s" <<'EOF'
          set -e
          curl -fsS -o /dev/null -w "local http status: %{http_code}\n" http://127.0.0.1:8095/ || true
          docker compose -f /opt/elvethgroup/docker-compose.yml ps || true
          EOF

      - name: Smoke test public URL
        run: |
          set -e
          url="${{ vars.SITE_URL }}"
          if [ -z "$url" ]; then
            url="https://elvethgroup.co.tz"
          fi
          echo "Checking $url"
          curl -sS -o /dev/null -w "status: %{http_code} final: %{url_effective}\n" -L --max-time 45 "$url" || true
